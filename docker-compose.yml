services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starsbattle}
      POSTGRES_USER: ${POSTGRES_USER:-starsbattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starsbattle}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stars-battle-postgres-data:/var/lib/postgresql/data

volumes:
  stars-battle-postgres-data:
